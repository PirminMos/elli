# =====================================================================
# elli – Gesamtstack: Web (Apache/PHP + Frontend) + MariaDB
#
#   Start:   docker compose up -d --build
#   Öffnen:  http://localhost:8080
#   Stop:    docker compose down          (Daten bleiben erhalten)
#   Reset:   docker compose down -v       (löscht auch die DB!)
# =====================================================================

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_NAME:-elli}"
      MARIADB_USER: "${DB_USER:-elli_user}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-1234}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootpw}"
    volumes:
      - db_data:/var/lib/mysql
      # Schema wird beim ERSTEN Start automatisch eingespielt (leeres Volume):
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"          # http://localhost:8080
    environment:
      DB_HOST: "db"
      DB_NAME: "${DB_NAME:-elli}"
      DB_USER: "${DB_USER:-elli_user}"
      DB_PASSWORD: "${DB_PASSWORD:-1234}"
      # Fuer "Backup erstellen" in der Oberflaeche: gleiche Rotationsgrenze
      # wie im backup-Container, damit beide einen gemeinsamen Vorrat bilden.
      BACKUP_KEEP: "${BACKUP_KEEP:-5}"
      # Damit die Oberflaeche den Pfad nennen kann, unter dem der Nutzer die
      # Datei tatsaechlich findet - "/backups" ist nur die Sicht im Container.
      BACKUP_HOST_DIR: "${PWD}/backups"
    volumes:
      # Schreibend eingebunden: Die Oberflaeche listet vorhandene Sicherungen
      # (Erststart-Import) und legt auf Knopfdruck selbst eine an. Geschrieben
      # und geloescht wird ausschliesslich nach dem Muster "elli-*.sql", damit
      # der web-Container nichts anderes im Verzeichnis anfassen kann.
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  # Update-Dienst: prueft auf neue Versionen bei GitHub und baut auf Zuruf
  # aus der Weboberflaeche heraus den web-Container neu ("Update"-Symbol
  # neben dem Versionshinweis).
  #
  # Er braucht dafuer zwei Dinge:
  #   - den Docker-Socket des Hosts (um Images zu bauen und Container zu
  #     ersetzen) -> das entspricht Administratorrechten auf diesem Rechner
  #   - das Projektverzeichnis unter /repo (git pull + Build-Kontext)
  # Deshalb ist der Port bewusst nur an 127.0.0.1 gebunden: erreichbar nur
  # von diesem Rechner, nicht aus dem Netz. Wer das nicht moechte, entfernt
  # diesen Block – die Oberflaeche blendet das Update-Symbol dann aus.
  updater:
    build:
      context: .
      dockerfile: docker/updater/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
      # Update-Dienst selbst aus dem Projekt laden, damit Aenderungen daran
      # mit dem naechsten Update wirksam werden (der Container wird beim
      # Update nicht ersetzt – er fuehrt es ja gerade aus).
      - ./docker/updater:/app:ro
    environment:
      REPO_DIR: /repo
      STATE_DIR: /state

  # Automatische DB-Sicherung im Hintergrund. Laeuft still mit, schreibt
  # rotierende Dumps nach ./backups. Zum Deaktivieren diesen Block entfernen.
  backup:
    image: mariadb:11
    restart: unless-stopped
    environment:
      DB_HOST: "db"
      DB_NAME: "${DB_NAME:-elli}"
      DB_USER: "${DB_USER:-elli_user}"
      DB_PASSWORD: "${DB_PASSWORD:-1234}"
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-86400}"   # Standard: taeglich (24 Stunden)
      BACKUP_KEEP: "${BACKUP_KEEP:-5}"               # Standard: 5 Dateien behalten
    volumes:
      - ./backups:/backups
      - ./docker/backup/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
