<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="stundentafelGrid">
      <circle cx="50" cy="50" r="36"/>
    </clipPath>
  </defs>
  <g fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Aeusserer Ring -->
    <circle cx="50" cy="50" r="46"/>
    <!-- Innerer Kreis (Rand des Gitters) -->
    <circle cx="50" cy="50" r="36"/>
    <!-- Gitter, auf den inneren Kreis geclippt -->
    <g clip-path="url(#stundentafelGrid)">
      <line x1="31" y1="10" x2="31" y2="90"/>
      <line x1="69" y1="10" x2="69" y2="90"/>
      <line x1="10" y1="31" x2="90" y2="31"/>
      <line x1="10" y1="69" x2="90" y2="69"/>
      <line x1="50" y1="10" x2="50" y2="41"/>
      <line x1="50" y1="59" x2="50" y2="90"/>
      <line x1="10" y1="50" x2="41" y2="50"/>
      <line x1="59" y1="50" x2="90" y2="50"/>
    </g>
  </g>
  <!-- Mittelpunkt -->
  <circle cx="50" cy="50" r="5" fill="#000000"/>
</svg>
